[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hdl-verify"
version = "0.1.0"
description = "A reusable hardware verification framework built on cocotb"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rhedding Smith"}]
dependencies = [
    "cocotb>=1.8",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
